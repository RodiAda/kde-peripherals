name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel cmake ninja git qt6-base dbus gettext
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -G Ninja -DPERIPHERALS_TESTS=ON
          cmake --build build
      - name: Test
        run: for t in build/*-test; do "$t"; done
